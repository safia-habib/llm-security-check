# Fly.io — single-instance deployment.
# Deploy: fly launch (first time) or fly deploy (subsequent runs).
# Docs:   https://fly.io/docs/reference/configuration/

app            = "llm-security-check"
primary_region = "iad"

[build]
  # Uses the project Dockerfile automatically.

[env]
  PORT                    = "8000"
  SCAN_TTL_MINUTES        = "30"
  RATE_LIMIT_PER_HOUR     = "5"
  MAX_PAGES               = "20"
  MAX_ASSETS              = "30"
  SCAN_TIMEOUT_SECONDS    = "120"
  REQUEST_TIMEOUT_SECONDS = "10"
  ALLOW_PRIVATE_TARGETS   = "false"

[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0
  processes           = ["app"]

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
